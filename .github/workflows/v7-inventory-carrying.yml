name: V7 Inventory-Carrying MM Validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture live BBO and trades
        run: python v6_bbo_capture.py --minutes 10 --out v7_live_bbo_trade.jsonl.gz
      - name: Run inventory-carrying replay
        run: python v7_inventory_carrying_mm.py v7_live_bbo_trade.jsonl.gz --out v7_inventory_carrying_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: v7-inventory-carrying-validation
          path: |
            v7_live_bbo_trade.jsonl.gz
            v7_inventory_carrying_summary.json
