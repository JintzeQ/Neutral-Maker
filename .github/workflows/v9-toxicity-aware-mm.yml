name: V9 Toxicity-Aware MM Validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install capture dependencies
        run: python -m pip install websockets
      - name: Capture 50 minutes fresh live BBO and trades
        run: python v6_bbo_capture.py --seconds 3000 --output v9_live_bbo_trade.jsonl.gz
      - name: Run V9 toxicity-aware replay and markouts
        run: python v9_toxicity_aware_mm.py v9_live_bbo_trade.jsonl.gz --out v9_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: v9-toxicity-aware-mm-validation
          path: |
            v9_live_bbo_trade.jsonl.gz
            v9_summary.json
