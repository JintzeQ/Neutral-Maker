name: V6 BBO Trade Ping-Pong MM Pilot

on:
  pull_request:
    paths:
      - 'v6_bbo_capture.py'
      - 'v6_bbo_trade_pingpong_mm.py'
      - '.github/workflows/v6-pingpong-live-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --upgrade websockets
      - name: Syntax check
        run: |
          python -m py_compile v6_bbo_capture.py
          python -m py_compile v6_bbo_trade_pingpong_mm.py
      - name: Capture direct BBO plus raw trades
        run: |
          python v6_bbo_capture.py \
            --seconds 600 \
            --output v6_live_bbo_trade.jsonl.gz
      - name: Replay inventory-neutral ping-pong maker
        run: |
          python v6_bbo_trade_pingpong_mm.py \
            --input v6_live_bbo_trade.jsonl.gz \
            --output-dir v6_pingpong_out \
            --quote-usdc 5 \
            --latency-ms 75
      - name: Upload V6 pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-bbo-trade-pingpong-pilot
          path: |
            v6_pingpong_out/
            v6_live_bbo_trade.jsonl.gz
          if-no-files-found: warn
          retention-days: 7
