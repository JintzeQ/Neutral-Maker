name: V3 Hummingbot-Inspired Optimization

on:
  push:
    branches: [v2-paper-validation]
    paths:
      - 'v3_hummingbot_optimized_proxy.py'
      - '.github/workflows/v3-hummingbot-optimized.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v3_hummingbot_optimized_proxy.py'
      - '.github/workflows/v3-hummingbot-optimized.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas

      - name: Syntax check
        run: python -m py_compile v3_hummingbot_optimized_proxy.py

      - name: Run V3 optimization and untouched OOS
        run: |
          python v3_hummingbot_optimized_proxy.py \
            --start-date 2026-08-13 \
            --end-date 2026-08-17 \
            --output-dir v3_hb_optimized_out \
            --bootstrap 3000

      - name: Upload V3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-hummingbot-optimized-2026-08-13-to-17
          path: v3_hb_optimized_out/
          if-no-files-found: warn
          retention-days: 14
