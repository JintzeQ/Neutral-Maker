name: V10 Markout-Label MM Validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install capture dependencies
        run: python -m pip install websockets
      - name: Capture 50 minutes live BBO and trades
        run: python v6_bbo_capture.py --seconds 3000 --output v10_live_bbo_trade.jsonl.gz
      - name: Run V10 markout-label replay
        run: python v10_markout_label_mm.py v10_live_bbo_trade.jsonl.gz --out v10_markout_label_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: v10-markout-label-validation
          path: |
            v10_live_bbo_trade.jsonl.gz
            v10_markout_label_summary.json
