name: V5 Pure Inventory-Neutral Market Maker

on:
  push:
    branches: [v2-paper-validation]
    paths:
      - 'v5_pure_inventory_neutral_mm.py'
      - '.github/workflows/v5-pure-inventory-neutral.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v5_pure_inventory_neutral_mm.py'
      - '.github/workflows/v5-pure-inventory-neutral.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Syntax check
        run: python -m py_compile v5_pure_inventory_neutral_mm.py
      - name: Run V5 pure two-sided MM validation
        run: |
          python v5_pure_inventory_neutral_mm.py \
            --start-date 2026-08-15 \
            --end-date 2026-08-17 \
            --output-dir v5_pure_mm_out
      - name: Upload V5 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-pure-inventory-neutral-2026-08-15-to-17
          path: v5_pure_mm_out/
          if-no-files-found: warn
          retention-days: 14
