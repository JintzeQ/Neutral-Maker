name: V10 Frozen Forward Validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install capture dependencies
        run: python -m pip install websockets
      - name: Capture fresh 50 minutes live BBO and trades
        run: python v6_bbo_capture.py --seconds 3000 --output v10_frozen_forward_live.jsonl.gz
      - name: Run frozen V10 forward replay
        run: python v10_frozen_forward_mm.py v10_frozen_forward_live.jsonl.gz --model v10_frozen_model.json --out v10_frozen_forward_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: v10-frozen-forward-validation
          path: |
            v10_frozen_forward_live.jsonl.gz
            v10_frozen_forward_summary.json
